<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><title>Yavuz Selim Durmaz — My Wallet</title><desc>Logo, bütçe ve grafik sırayla oluşur. Veriler temsilidir.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1A2030"/><stop offset="1" stop-color="#090C13"/></linearGradient><linearGradient id="brand" x2="1" y2="1"><stop stop-color="#FFC377"/><stop offset=".5" stop-color="#EE7C9E"/><stop offset="1" stop-color="#9B79ED"/></linearGradient><clipPath id="clip"><rect x="617" y="66" width="90" height="90" rx="24"/></clipPath><style>
.logo{animation:logo 8s ease-in-out infinite}.budget{animation:budget 8s ease-in-out infinite}.chart{animation:chart 8s ease-in-out infinite}.bar{transform-box:fill-box;transform-origin:left;animation:bar 8s ease-in-out infinite}.ring{stroke-dasharray:290 402;animation:ring 8s ease-in-out infinite}
@keyframes logo{0%{opacity:0;transform:translateY(12px)}12%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes budget{0%,14%{opacity:0;transform:translateY(16px)}28%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes chart{0%,32%{opacity:0;transform:translateY(16px)}46%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@keyframes bar{0%,25%{transform:scaleX(0)}48%,100%{transform:scaleX(1)}}
@keyframes ring{0%,42%{stroke-dashoffset:290}65%,100%{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.logo,.budget,.chart,.bar,.ring{animation:none}}
</style></defs><rect x="1" y="1" width="1198" height="438" rx="25" fill="url(#bg)" stroke="#343C4D"/><g font-family="Segoe UI,Arial,sans-serif"><text x="55" y="81" fill="#CAAFE9" font-size="14" letter-spacing="3">ANDROID DEVELOPER</text><text x="53" y="156" fill="#F8FAFC" font-size="43" font-weight="700" letter-spacing="-1.5">Yavuz Selim Durmaz</text><text x="55" y="207" fill="#CCD4E2" font-size="24">Fikirden günlük kullanıma.</text><text x="55" y="245" fill="#A4B0C4" font-size="18">My Wallet’ın geliştiricisi.</text><path d="M55 288H500" stroke="#353E50"/><text x="55" y="328" fill="#C7D0DD" font-size="13" letter-spacing="1">KOTLIN / COMPOSE / FIREBASE</text><text x="55" y="380" fill="#97A4B8" font-size="12" letter-spacing="3">TRACK. SAVE. GROW.</text>
<g class="logo"><rect x="617" y="66" width="90" height="90" rx="24" fill="url(#brand)"/><g clip-path="url(#clip)"><path d="M610 135Q650 85 683 110L718 138V163H610Z" fill="#151823"/><path d="M640 126Q650 116 658 126V141H640Z M665 126Q675 116 683 126V141H665Z" fill="white"/></g><rect x="617" y="66" width="90" height="90" rx="24" fill="none" stroke="white" stroke-opacity=".2"/><text x="729" y="110" fill="#F1F4FA" font-size="25" font-weight="600">My Wallet</text><text x="730" y="135" fill="#9CAAC0" font-size="12">Finansın, daha anlaşılır.</text></g>
<g class="budget"><rect x="610" y="190" width="260" height="181" rx="18" fill="#202737" stroke="#3A445A"/><text x="633" y="225" fill="#B2BED0" font-size="14">Aylık bütçe</text><text x="633" y="269" fill="#F8FAFC" font-size="33" font-weight="600">₺12.000</text><rect x="634" y="290" width="211" height="7" rx="3.5" fill="#3A4356"/><rect class="bar" x="634" y="290" width="139" height="7" rx="3.5" fill="#BBA2F2"/><text x="633" y="338" fill="#B2BED0" font-size="12">Bütçenin %66’sı kullanıldı</text></g>
<g class="chart"><rect x="895" y="155" width="248" height="216" rx="18" fill="#202737" stroke="#3A445A"/><text x="919" y="187" fill="#B2BED0" font-size="14">Harcama dağılımı</text><circle cx="1019" cy="271" r="58" fill="none" stroke="#3A4356" stroke-width="12"/><circle class="ring" cx="1019" cy="271" r="58" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 1019 271)"/><text x="1019" y="270" text-anchor="middle" fill="#F8FAFC" font-size="24" font-weight="600">₺7.920</text><text x="1019" y="291" text-anchor="middle" fill="#AFBBD0" font-size="11">BU AY</text><text x="1019" y="350" text-anchor="middle" fill="#AFBBD0" font-size="11">Harcamalarını anlamlandır.</text></g><text x="1140" y="409" text-anchor="end" fill="#8290A6" font-size="10" letter-spacing="1">TEMSİLİ VERİLER</text></g></svg>
